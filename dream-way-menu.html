<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dream Way — المنيو الإلكتروني</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#f4f8fb;--card:#fff;--ink:#3b4047;--mut:#7a838c;--brand:#0a9de0;--brand2:#0877b0;--onb:#fff;--line:#dde6ee;--soft:#e6f4fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171c;--card:#1b232b;--ink:#e8edf1;--mut:#97a3ae;--brand:#35b4ee;--brand2:#7cccf3;--onb:#06202e;--line:#2a343e;--soft:#16303f}}
:root[data-theme="dark"]{--bg:#12171c;--card:#1b232b;--ink:#e8edf1;--mut:#97a3ae;--brand:#35b4ee;--brand2:#7cccf3;--onb:#06202e;--line:#2a343e;--soft:#16303f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;padding-bottom:110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:12px 14px 0}
.brand{display:flex;align-items:center;gap:10px}
.logo{height:64px;width:auto;border-radius:12px;background:#fff;padding:3px 8px;object-fit:contain}
.brand h1{margin:0;font-size:20px;font-weight:800;line-height:1.1}
.brand h1 span{color:var(--brand)}
.brand p{margin:2px 0 0;font-size:12px;color:var(--mut)}
.search{margin:10px 0 8px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:11px 40px 11px 12px;font:inherit;font-size:14px}
.search span{position:absolute;right:13px;top:50%;transform:translateY(-50%);opacity:.6}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--brand);color:var(--onb);border-color:var(--brand)}
main{padding:14px;max-width:760px;margin:0 auto}
h2{font-size:18px;margin:18px 0 10px;font-weight:800;border-right:4px solid var(--brand);padding-right:10px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;gap:12px}.item img{width:88px;height:88px;object-fit:cover;border-radius:12px;flex:none;background:#fff}.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}h2 small{font-size:12px;color:var(--mut);font-weight:600;margin-right:6px}
.item b{font-size:15px;line-height:1.35}
.item b{direction:ltr;display:block;text-align:right}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.price{font-weight:800;color:var(--brand2);font-size:16px}
.price i{font-style:normal;font-size:11px;font-weight:600;color:var(--mut);margin-right:3px}
.add{border:0;background:var(--brand);color:var(--onb);border-radius:12px;padding:8px 12px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.qty{display:flex;align-items:center;gap:4px;background:var(--soft);border-radius:12px;padding:3px}
.qty button{width:32px;height:32px;border:0;border-radius:9px;background:var(--brand);color:var(--onb);font-size:18px;font-weight:800;cursor:pointer;line-height:1}
.qty span{min-width:26px;text-align:center;font-weight:800}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
#bar{position:fixed;inset:auto 0 0 0;z-index:25;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:none}
#bar.show{display:block}
#bar button{width:100%;max-width:760px;margin:auto;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:18px;background:var(--brand);color:var(--onb);padding:14px 18px;font:inherit;font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(10,157,224,.35);cursor:pointer}
#bar em{font-style:normal;background:var(--onb);color:var(--brand2);border-radius:99px;min-width:26px;height:26px;display:inline-grid;place-items:center;font-size:13px;margin-left:8px;padding:0 6px}
#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
.pane{background:var(--card);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.pane h3{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:var(--soft);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.line div:first-child{flex:1}
.line small{color:var(--mut);display:block}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding:12px 0}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
.mode button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px;font:inherit;font-weight:700;cursor:pointer}
.mode button.on{background:var(--brand);color:var(--onb);border-color:var(--brand)}
.f{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px;font:inherit;font-size:14px;margin-bottom:8px}
.err{color:#d6453d;font-size:13px;min-height:18px;margin:0 0 6px}
.send{width:100%;border:0;border-radius:14px;background:#25d366;color:#053b1b;padding:14px;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
.note{font-size:12px;color:var(--mut);margin:6px 0 10px}
</style>
</head>

const IK=[()=>'or',()=>'hot',()=>'ice',()=>'cf',()=>'nf',()=>'mt',i=>'m'+Math.floor(i/3),()=>'ju',()=>'sm',()=>'mk',i=>'s'+Math.floor(i/3),i=>i<6?'b0':'b1'];
const imgOf=(id)=>{const[a,b]=id.split('_');return IM[IK[+a](+b)]};
const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString("ar-EG")+" "+CUR;
function chips(){$("chips").innerHTML=[["الكل",-1]].concat(DATA.map((s,i)=>[s.e+" "+SEN[i],i])).map(c=>`<button class="chip ${c[1]===cat?"on":""}" data-c="${c[1]}">${c[0]}</button>`).join("")}
function ctl(id){const q=cart[id]||0;return q?`<div class="qty"><button data-m="${id}" aria-label="تقليل">−</button><span>${q.toLocaleString("ar-EG")}</span><button data-a="${id}" aria-label="زيادة">+</button></div>`:`<button class="add" data-a="${id}">➕ إضافة للسلة</button>`}
function render(){
  const k=$("q").value.trim().toLowerCase();let h="";
  DATA.forEach((s,si)=>{if(cat>=0&&cat!==si)return;const it=s.items.filter(i=>!k||i.ar.includes(k)||i.en.toLowerCase().includes(k));if(!it.length)return;
    h+=`<h2>${s.e} ${SEN[si]}<small>${s.n}</small></h2><div class="grid">`+it.map(i=>`<div class="item"><img src="${imgOf(i.id)}" alt="${i.en}" loading="lazy"><div class="info"><b>${i.en}</b><div class="row"><span class="price">${i.p.toLocaleString("ar-EG")}<i>${CUR}</i></span><span id="c${i.id}">${ctl(i.id)}</span></div></div></div>`).join("")+"</div>"});
  $("main").innerHTML=h||'<p class="empty">لا توجد أصناف مطابقة لبحثك. جرّب كلمة أخرى.</p>';
}
function totals(){let n=0,t=0;for(const id in cart){n+=cart[id];t+=cart[id]*ALL[id].p}return{n,t}}
function upd(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];const e=$("c"+id);if(e)e.innerHTML=ctl(id);sync()}
function sync(){const{n,t}=totals();$("bar").classList.toggle("show",n>0);$("cnt").textContent=n.toLocaleString("ar-EG");$("tot").textContent=fmt(t);if($("sheet").classList.contains("open"))lines()}
function lines(){const{n,t}=totals();if(!n){$("sheet").classList.remove("open");return}
  $("lines").innerHTML=Object.keys(cart).map(id=>{const i=ALL[id];return`<div class="line"><div style="direction:ltr;text-align:right">${i.en}<small>${fmt(i.p)} × ${cart[id].toLocaleString("ar-EG")} = ${fmt(i.p*cart[id])}</small></div><div class="qty"><button data-m="${id}">−</button><span>${cart[id].toLocaleString("ar-EG")}</span><button data-a="${id}">+</button></div></div>`}).join("");$("tot2").textContent=fmt(t)}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.a)upd(b.dataset.a,1);else if(b.dataset.m)upd(b.dataset.m,-1);
  else if(b.dataset.c!==undefined){cat=+b.dataset.c;chips();render();scrollTo({top:0})}});
$("q").addEventListener("input",render);
$("openCart").onclick=()=>{lines();$("sheet").classList.add("open")};
$("close").onclick=()=>$("sheet").classList.remove("open");
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")$("sheet").classList.remove("open")});
function setMode(m){mode=m;$("m1").classList.toggle("on",m==="dine");$("m2").classList.toggle("on",m==="deliv");$("dine").hidden=m!=="dine";$("deliv").hidden=m!=="deliv";$("err").textContent=""}
$("m1").onclick=()=>setMode("dine");$("m2").onclick=()=>setMode("deliv");
$("send").onclick=()=>{
  const{n,t}=totals();if(!n)return;const v=id=>$(id).value.trim(),notes=v("notes");let head;
  if(mode==="dine"){if(!v("table")){$("err").textContent="اكتب رقم الطاولة أولاً.";return}head=`📍 *النوع:* داخل المطعم\n🪑 *رقم الطاولة:* ${v("table")}`}
  else{if(!v("name")||!v("phone")||!v("addr")){$("err").textContent="اكتب الاسم ورقم الموبايل والعنوان.";return}head=`📍 *النوع:* توصيل للمنزل\n👤 *الاسم:* ${v("name")}\n📞 *الموبايل:* ${v("phone")}\n🏠 *العنوان:* ${v("addr")}`}
  const d=new Date(),items=Object.keys(cart).map((id,k)=>{const i=ALL[id];return`${k+1}. ${i.en}\n    ${cart[id]} × ${i.p} = ${cart[id]*i.p} ${CUR}`}).join("\n");
  const msg=`🧾 *طلب جديد — Dream Way*\n🕒 ${d.toLocaleDateString("ar-EG")} ${d.toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"})}\n━━━━━━━━━━━━\n${head}\n━━━━━━━━━━━━\n*الأصناف:*\n${items}\n━━━━━━━━━━━━\n🔢 عدد الأصناف: ${n}\n💰 *الإجمالي: ${t} ${CUR}*${mode==="deliv"?"\n(لا يشمل رسوم التوصيل)":""}${notes?`\n📝 *ملاحظات:* ${notes}`:""}`;
  const url=`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`;let w=null;try{w=window.open(url,"_blank")}catch(_){}if(!w)showFb(msg,url)};
function showFb(msg,url){$("fbt").value=msg;$("fbl").href=url;$("fb").hidden=false;$("fbc").textContent="نسخ الفاتورة";$("fb").scrollIntoView({behavior:"smooth",block:"center"})}
$("fbc").onclick=async()=>{const t=$("fbt");let ok=false;try{await navigator.clipboard.writeText(t.value);ok=true}catch(_){try{t.select();ok=document.execCommand("copy")}catch(__){}}$("fbc").textContent=ok?"تم النسخ ✓":"حدّد النص وانسخه يدوياً"};
chips();render();
</script>
